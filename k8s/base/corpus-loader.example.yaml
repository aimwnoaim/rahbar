# Temporary helper only. Do not include this resource in kustomization.yaml.
# Apply it after the corpus-data PVC is Bound, copy files with kubectl cp, then delete it.
apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 36000"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: corpus
          mountPath: /corpus
  volumes:
    - name: corpus
      persistentVolumeClaim:
        claimName: corpus-data
