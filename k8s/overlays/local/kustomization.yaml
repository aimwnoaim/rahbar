apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
images:
  - name: rahbar-api
    newTag: 675ec46644f8ef2a4d0247322225f3bb6fb779cd
  - name: rahbar-indexer
    newTag: 675ec46644f8ef2a4d0247322225f3bb6fb779cd
  - name: rahbar-ui
    newTag: 675ec46644f8ef2a4d0247322225f3bb6fb779cd
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
        namespace: rahbar
      data:
        RETRIEVER: chroma
        LLM_PROVIDER: ollama-host
        EMBED_MODEL: nomic-embed-text
        OLLAMA_URL: http://192.168.49.10:11434
  - target:
      kind: NetworkPolicy
      name: api-policy
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.10/32
  - target:
      kind: NetworkPolicy
      name: indexer-egress
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.49.10/32
