apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
        namespace: rahbar
      data:
        RETRIEVER: chroma
        LLM_PROVIDER: ollama-host
        EMBED_MODEL: nomic-embed-text
images:
  - name: rahbar-api
    newName: DOCKERHUB_USERNAME/rahbar-api
    newTag: REPLACE_WITH_GIT_SHA
  - name: rahbar-indexer
    newName: DOCKERHUB_USERNAME/rahbar-indexer
    newTag: REPLACE_WITH_GIT_SHA
  - name: rahbar-ui
    newName: DOCKERHUB_USERNAME/rahbar-ui
    newTag: REPLACE_WITH_GIT_SHA
