apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
images:
  - name: rahbar-api
    newName: DOCKERHUB_USERNAME/rahbar-api
    newTag: REPLACE_WITH_GIT_SHA
  - name: rahbar-indexer
    newName: DOCKERHUB_USERNAME/rahbar-indexer
    newTag: REPLACE_WITH_GIT_SHA
  - name: rahbar-ui
    newName: DOCKERHUB_USERNAME/rahbar-ui
    newTag: REPLACE_WITH_GIT_SHA
