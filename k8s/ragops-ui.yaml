apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragops-ui
  namespace: ragops
  labels:
    app.kubernetes.io/name: ragops-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ragops-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragops-ui
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: rahbar-ui:ragops
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ragops-ui
  namespace: ragops
  labels:
    app.kubernetes.io/name: ragops-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ragops-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
